<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VALUEX | Institutional Digital Business Valuation Platform (MM6026)</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- KaTeX for LaTeX equations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- React 18 & ReactDOM Production UMD via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (Browser JSX compilation) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons UMD via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Pre-loaded Indonesian Coverage Universe Data -->
  <script src="/static/coverage_data.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: #F4F6F8;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
      font-feature-settings: "tnum" 1;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      .max-w-5xl, .max-w-5xl * {
        visibility: visible;
      }
      .max-w-5xl {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
      }
    }
  </style>

  <!-- Global Error Logger -->
  <script>
    window.addEventListener('error', function(e) {
      console.error("Global Error Caught:", e);
      var root = document.getElementById('root');
      if (root && (!root.innerHTML || root.innerHTML.includes('Initializing MM6026'))) {
        root.innerHTML = '<div style="padding: 24px; font-family: monospace; background: #fff1f2; color: #9f1239; border: 2px solid #f43f5e; margin: 20px; border-radius: 6px;">' +
          '<h2 style="font-weight: bold; font-size: 16px; margin-bottom: 8px;">Runtime Error:</h2>' +
          '<p>' + (e.message || 'Unknown script error') + '</p>' +
          '<pre style="background: white; padding: 12px; margin-top: 10px; font-size: 11px; overflow: auto;">' + (e.error ? e.error.stack : '') + '</pre>' +
          '</div>';
      }
    });
  </script>
</head>
<body class="bg-[#F4F6F8] text-slate-900">
  <div id="root">
    <!-- Initial Loading Screen -->
    <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0A1120; color: #f8fafc; font-family: monospace;">
      <div style="width: 48px; height: 48px; border: 3px solid #1E293B; border-top: 3px solid #3B82F6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
      <div style="font-weight: bold; font-size: 16px; letter-spacing: 0.1em;">VALUEX EQUITY RESEARCH TERMINAL</div>
      <div style="font-size: 12px; color: #94A3B8; margin-top: 6px;">Initializing Universal Valuation Engine (All IDX Listed Equities)...</div>
    </div>
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </div>

  <!-- Mount React SPA Script with cache-busting -->
  <script type="text/babel" src="/static/app_react.jsx?v=20261025_peers_v5"></script>
</body>
</html>
